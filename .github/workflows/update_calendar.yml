name: Update Prayer Times iCal

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests icalendar

      - name: Run Python script
        run: python sholat_to_ics.py

      - name: Auto commit and push changed files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update monthly prayer times .ics"
          file_pattern: "*.ics"
